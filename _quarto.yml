project:
  type: website
  output-dir: _site

website:
  title: "A Small Stage" 
  site-url: "https://YaraRin.github.io/my_blog/"
  description: "位我上者，灿烂星空；道德律令，赠与清风~"
  
  navbar:
    background: dark
    collapse: true
    left:
      - text: "Archive / 档案"
        href: index.qmd
      - text: "Gaming"
        href: "index.qmd#category=Gaming"
      - text: "Research"
        href: "index.qmd#category=Research"
      - text: "Story"
        href: "index.qmd#category=Story"
    right:
      - text: "About"
        href: about.qmd
      - icon: chat-square-dots
        href: ask.qmd
        text: "AMA"
      - icon: envelope
        href: mailto:GreenwichintheSky@outlook.com

  # 页脚注入返回顶部按钮与访客统计
  body-footer: custom.html

  page-footer:
    border: true
    center: "A Small Stage · Personal research archive"

format:
  html:
    include-in-header:
      text: |
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css">
    theme:
      light: cosmo
      dark: darkly
    dark-mode-switch: true
    page-layout: full
    toc-depth: 3
    smooth-scroll: true
    hover-footnotes: true
    date-format: "YYYY-MM-DD"
    css: styles.css
    toc: true
    toc-title: "目录"
    code-fold: true
    code-summary: "展开查看代码"
    code-copy: true
    lightbox: true
    link-external-newwindow: true
    comments:
      giscus:
        repo: YaraRin/my_blog
        repo-id: R_kgDORxBgzw
        category: Comments
        category-id: DIC_kwDORxBgz84C5_8x
        mapping: pathname
        reactions-enabled: true
        theme:
          light: light
          dark: dark
        language: zh-CN

lang: zh
