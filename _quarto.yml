project:
  type: website
  output-dir: _site

website:
  title: "A Small Stage" # 引用自萨根：A very small stage in a vast cosmic arena.
  site-url: "https://YaraRin.github.io"
  description: 占位符A
  
  # 导航栏配置：左侧逻辑分类，右侧联系方式
  navbar:
    background: "#f8f9fa" # 淡淡的纸张灰
    collapse: true
    search: true
    left:
      - text: "Archive / 档案"
        href: index.qmd
      - text: "Gaming"
        href: "index.qmd#category=Gaming"
      - text: "Research" # 考据与社会物理学
        href: "index.qmd#category=Research"
      - text: "Godot"
        href: "index.qmd#category=Dev"
    right:
      - icon: envelope
        text: "Contact"
        href: mailto:GreenwichintheSky@outlook.com 


format:
  html:
    theme: 
      light: [sandstone]
    css: styles.css
    toc: true
    toc-title: "目录"
    number-sections: false
    code-fold: true
    code-summary: "展开查看代码"
    code-copy: true
    lightbox: true
    link-external-newwindow: true
    comments:
      giscus:
        repo: YaraRin/my_blog
        repo-id: R_kgDORxBgzw
        category: Comments
        category-id: DIC_kwDORxBgz84C5_8x
        mapping: pathname
        reactions-enabled: true
        theme: light
        language: zh-CN

# 博客列表页配置
listing:
  contents: posts
  sort: "date desc"
  type: default
  categories: true          
  sort-ui: true
  filter-ui: true
  page-size: 10
  fields: [date, title, reading-time, description, categories]
  feed: true                

# 语言设置
lang: zh



