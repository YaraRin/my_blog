project:
  type: website
  output-dir: _site

website:
  title: "A Small Stage" # 引用自萨根：A very small stage in a vast cosmic arena.
  site-url: "https://YaraRin.github.io"
  description: "法律、物理与游戏代码之间的非线性碰撞。"
  
  # 导航栏配置：左侧逻辑分类，右侧联系方式
  navbar:
    background: "#f8f9fa" # 淡淡的纸张灰
    collapse: true
    search: true
    left:
      - text: "Archive / 档案"
        href: index.qmd
      - text: "Gaming"
        href: "index.qmd#category=Gaming"
      - text: "Research" # 考据与社会物理学
        href: "index.qmd#category=Research"
      - text: "Godot"
        href: "index.qmd#category=Dev"
    right:
      - icon: envelope
        text: "Contact"
        href: mailto:GreenwichintheSky@outlook.com # 请手动修改为你的 Outlook 

# 全球化配置：Men's Fudge 审美 + 学术考据排版
format:
  html:
    theme: 
      light: [sandstone] # Sandstone 非常符合复古、知性的质感
    css: styles.css
    toc: true               # 右侧目录，方便长篇考据阅读
    toc-title: "目录"
    number-sections: false  # 随笔建议不加 1.1.1 这种死板编号
    code-fold: true         # 默认折叠 Godot 代码块，保持页面整洁
    code-summary: "展开查看代码"
    code-copy: true
    lightbox: true          # 自动开启图片灯箱（看 Xbox 截图必备）
    link-external-newwindow: true # 外链（如法律代码化网站）在新窗口打开

# 博客列表页配置
listing:
  contents: posts
  sort: "date desc"
  type: default
  categories: true          # 开启右侧分类过滤
  sort-ui: true
  filter-ui: true
  page-size: 10
  fields: [date, title, reading-time, description, categories]
  feed: true                # 开启 RSS，方便少数派同好订阅

# 语言设置
lang: zh



