project:
  type: website
  output-dir: _site

website:
  title: "A Small Stage" 
  site-url: "https://YaraRin.github.io/my_blog/"
  description: "位我上者，灿烂星空；道德律令，赠与清风~"
  
  navbar:
    background: dark
    collapse: true
    left:
      - text: "Archive / 档案"
        href: index.qmd
      - text: "Gaming"
        href: "index.qmd#category=Gaming"
      - text: "Research"
        href: "index.qmd#category=Research"
      - text: "Story"
        href: "index.qmd#category=story"
    right:
      - text: "About"
        href: about.qmd
      - icon: chat-square-dots
        href: ask.qmd
        aria-label: "匿名提问箱"
      - icon: envelope
        href: mailto:GreenwichintheSky@outlook.com

  # 页脚注入返回顶部按钮 + 目录高亮 JS
  body-footer: custom.html

format:
  html:
    include-in-header:
      text: |
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css">
    theme:
      light: cosmo
      dark: darkly
    dark-mode-switch: true
    page-layout: full
    hover-footnotes: true
    date-format: "YYYY-MM-DD"
    css: styles.css
    toc: true
    toc-title: "目录"
    reading-time: true
    code-fold: true
    code-summary: "展开查看代码"
    code-copy: true
    lightbox: true
    link-external-newwindow: true
    comments:
      giscus:
        repo: YaraRin/my_blog
        repo-id: R_kgDORxBgzw
        category: Comments
        category-id: DIC_kwDORxBgz84C5_8x
        mapping: pathname
        reactions-enabled: true
        theme: light
        language: zh-CN

listing:
  contents: posts
  type: grid           
  grid-columns: 3      
  image-height: 220px  
  grid-item-border: false 
  grid-item-align: left
  fields: [image, title, date, categories, description] 
  sort: "date desc"
  categories: true
  max-description-length: 50
  feed: true

lang: zh
